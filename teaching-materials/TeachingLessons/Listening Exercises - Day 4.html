  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e Mono',monospace;font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.48 0.10 150);margin-bottom:2px;\">Toca el dibujo<\u002Fspan>\n          <span style=\"display:block;font-weight:600;font-size:1.12rem;line-height:1.15;\">¿Dónde está?<\u002Fspan>\n          <span style=\"display:block;font-family:'Space Mono',monospace;font-size:0.74rem;color:#8a8073;\">Next to · in front of · behind<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"flex:none;font-size:1.1rem;color:#c3b8a6;\">▸<\u002Fspan>\n      <\u002Fbutton>\n\n      <button onclick=\"{{ openRightLeft }}\" style=\"display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:#fff;border:2px solid #E7DFD2;border-radius:18px;box-shadow:0 4px 14px rgba(42,38,34,0.06);padding:16px;cursor:pointer;color:#2A2622;\">\n        <span style=\"flex:none;width:52px;height:52px;border-radius:14px;background:oklch(0.94 0.035 355);display:flex;align-items:center;justify-content:center;font-size:1.7rem;\">🧭<\u002Fspan>\n        <span style=\"flex:1;min-width:0;\">\n          <span style=\"display:block;font-family:'Space Mono',monospace;font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.52 0.13 355);margin-bottom:2px;\">Clasifica<\u002Fspan>\n          <span style=\"display:block;font-weight:600;font-size:1.12rem;line-height:1.15;\">¿Derecha o izquierda?<\u002Fspan>\n          <span style=\"display:block;font-family:'Space Mono',monospace;font-size:0.74rem;color:#8a8073;\">It will be on your right/left<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"flex:none;font-size:1.1rem;color:#c3b8a6;\">▸<\u002Fspan>\n      <\u002Fbutton>\n\n      <button onclick=\"{{ openLandmarks }}\" style=\"display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:#fff;border:2px solid #E7DFD2;border-radius:18px;box-shadow:0 4px 14px rgba(42,38,34,0.06);padding:16px;cursor:pointer;color:#2A2622;\">\n        <span style=\"flex:none;width:52px;height:52px;border-radius:14px;background:oklch(0.94 0.03 90);display:flex;align-items:center;justify-content:center;font-size:1.7rem;\">🏛️<\u002Fspan>\n        <span style=\"flex:1;min-width:0;\">\n          <span style=\"display:block;font-family:'Space Mono',monospace;font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.48 0.09 90);margin-bottom:2px;\">Toca la imagen<\u002Fspan>\n          <span style=\"display:block;font-weight:600;font-size:1.12rem;line-height:1.15;\">Puntos de referencia<\u002Fspan>\n          <span style=\"display:block;font-family:'Space Mono',monospace;font-size:0.74rem;color:#8a8073;\">La plaza · la iglesia · el mercado…<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"flex:none;font-size:1.1rem;color:#c3b8a6;\">▸<\u002Fspan>\n      <\u002Fbutton>\n\n      <button onclick=\"{{ openUpDown }}\" style=\"display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:#fff;border:2px solid #E7DFD2;border-radius:18px;box-shadow:0 4px 14px rgba(42,38,34,0.06);padding:16px;cursor:pointer;color:#2A2622;\">\n        <span style=\"flex:none;width:52px;height:52px;border-radius:14px;background:oklch(0.94 0.03 230);display:flex;align-items:center;justify-content:center;font-size:1.7rem;\">⛰️<\u002Fspan>\n        <span style=\"flex:1;min-width:0;\">\n          <span style=\"display:block;font-family:'Space Mono',monospace;font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.44 0.10 230);margin-bottom:2px;\">Clasifica<\u002Fspan>\n          <span style=\"display:block;font-weight:600;font-size:1.12rem;line-height:1.15;\">¿Subir o bajar?<\u002Fspan>\n          <span style=\"display:block;font-family:'Space Mono',monospace;font-size:0.74rem;color:#8a8073;\">Go up / go down — terreno andino<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"flex:none;font-size:1.1rem;color:#c3b8a6;\">▸<\u002Fspan>\n      <\u002Fbutton>\n\n    <\u002Fdiv>\n\n    <p style=\"text-align:center;font-family:'Space Mono',monospace;font-size:0.68rem;color:#b3a894;margin-top:32px;\">Teach for Success · Día 4<\u002Fp>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPlay }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px;\">\n      <button onclick=\"{{ backHome }}\" style=\"flex:none;background:#fff;border:2px solid #E7DFD2;border-radius:12px;padding:8px 12px;cursor:pointer;font-family:'Space Mono',monospace;font-size:0.72rem;color:#2A2622;\">‹ Menú<\u002Fbutton>\n      <div style=\"flex:1;\">\n        <div style=\"font-family:'Space Mono',monospace;font-size:0.66rem;letter-spacing:0.1em;color:#8a8073;margin-bottom:5px;\">{{ activityTitle }} · {{ progressText }}<\u002Fdiv>\n        <div style=\"height:7px;background:#EDE6DA;border-radius:99px;overflow:hidden;\"><div style=\"{{ barStyle }}\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"text-align:center;font-family:'Fraunces',serif;font-weight:500;font-size:1.12rem;line-height:1.35;margin:0 0 16px;\">{{ instruction }}<\u002Fp>\n\n    <div style=\"display:flex;justify-content:center;margin-bottom:22px;\">\n      <button onclick=\"{{ listenOnClick }}\" style=\"{{ listenStyle }}\">\n        <span style=\"position:relative;display:flex;align-items:center;justify-content:center;width:60px;height:60px;\">\n          <span style=\"{{ pulseStyle }}\"><\u002Fspan>\n          <span style=\"position:relative;font-size:2rem;\">🔊<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-family:'Space Mono',monospace;font-size:0.74rem;letter-spacing:0.06em;\">Escuchar otra vez<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isSort }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;\">\n      <sc-for list=\"{{ buckets }}\" as=\"bk\" hint-placeholder-count=\"2\">\n        <button onclick=\"{{ bk.onClick }}\" disabled=\"{{ bk.disabled }}\" style=\"{{ bk.style }}\">\n          <span style=\"font-size:2.4rem;line-height:1;\">{{ bk.emoji }}<\u002Fspan>\n          <span style=\"font-weight:600;font-size:1.05rem;\">{{ bk.labelEs }}<\u002Fspan>\n          <span style=\"font-family:'Space Mono',monospace;font-size:0.68rem;color:#8a8073;\">{{ bk.labelEn }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showGrid }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"{{ optionsGridStyle }}\">\n      <sc-for list=\"{{ options }}\" as=\"opt\" hint-placeholder-count=\"4\">\n        <button onclick=\"{{ opt.onClick }}\" disabled=\"{{ opt.disabled }}\" style=\"{{ opt.style }}\">\n          <sc-if value=\"{{ opt.isEmoji }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:2.7rem;line-height:1;\">{{ opt.emoji }}<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ opt.isText }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ opt.textStyle }}\">{{ opt.text }}<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ opt.isDiagram }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"{{ opt.diagContainerStyle }}\">\n              <span style=\"{{ opt.diagBackStyle }}\">{{ opt.diagBackEmoji }}<\u002Fspan>\n              <span style=\"{{ opt.diagFrontStyle }}\">{{ opt.diagFrontEmoji }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ opt.showCaption }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;color:#6b6257;text-align:center;line-height:1.15;\">{{ opt.caption }}<\u002Fspan><\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showCheck }}\" hint-placeholder-val=\"{{ false }}\">\n    <button onclick=\"{{ checkOnClick }}\" disabled=\"{{ checkDisabled }}\" style=\"{{ checkStyle }}\">Comprobar ✓<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ feedbackShow }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"{{ feedbackStyle }}\">\n      <div style=\"font-family:'Space Mono',monospace;font-weight:700;font-size:0.92rem;\">{{ feedbackMsg }}<\u002Fdiv>\n      <div style=\"font-family:'Fraunces',serif;font-weight:600;font-size:1.25rem;margin-top:4px;\">{{ feedbackReveal }}<\u002Fdiv>\n      <sc-if value=\"{{ hasRevealEs }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-family:'Fraunces',serif;font-style:italic;font-size:0.98rem;color:#6b6257;margin-top:2px;\">{{ feedbackRevealEs }}<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ nextShow }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;justify-content:center;margin-top:18px;\">\n      <button onclick=\"{{ nextOnClick }}\" style=\"{{ nextStyle }}\">{{ nextLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isEnd }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"text-align:center;padding-top:24px;\">\n    <div style=\"background:#fff;border:2px solid #E7DFD2;border-radius:22px;box-shadow:0 6px 20px rgba(42,38,34,0.08);padding:32px 24px;\">\n      <div style=\"font-size:2.6rem;margin-bottom:6px;\">🎉<\u002Fdiv>\n      <h2 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:1.5rem;margin:0 0 6px;\">{{ endTitle }}<\u002Fh2>\n      <div style=\"{{ endScoreStyle }}\">{{ endScore }}<\u002Fdiv>\n      <p style=\"font-family:'Space Mono',monospace;font-size:0.85rem;color:#6b6257;margin:8px 0 0;\">{{ endMsg }}<\u002Fp>\n      <div style=\"display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap;\">\n        <button onclick=\"{{ retryOnClick }}\" style=\"{{ retryStyle }}\">Repetir 🔄<\u002Fbutton>\n        <button onclick=\"{{ homeOnClick }}\" style=\"background:#fff;border:2px solid #E7DFD2;border-radius:14px;padding:12px 20px;cursor:pointer;font-family:'Space Mono',monospace;font-weight:700;font-size:0.82rem;color:#2A2622;\">Menú<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { screen:'home', activityKey:null, deck:[], idx:0, phase:'listening', selected:[], checked:false, correctCount:0 };\n\n  componentDidMount(){\n    this.voiceList=[];\n    const load=()=>{ if('speechSynthesis' in window) this.voiceList=window.speechSynthesis.getVoices(); };\n    load();\n    if('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged=load;\n    this.buildData();\n  }\n\n  shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }\n  sample(arr,n){ return this.shuffle(arr).slice(0,n); }\n  setEqual(a,b){ return a.length===b.length && a.every(x=>b.includes(x)); }\n  cap1(str){ return str.charAt(0).toUpperCase()+str.slice(1); }\n  numberToWords(n){\n    const ones=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];\n    return ones[n]||String(n);\n  }\n\n  buildData(){\n    if(this._built) return; this._built=true;\n    this.PLACES=[\n      {id:'bathroom',emoji:'🚻',en:'bathroom',tap:'the bathroom',es:'el baño'},\n      {id:'hospital',emoji:'🏥',en:'hospital',tap:'the hospital',es:'el hospital'},\n      {id:'restaurant',emoji:'🍽️',en:'restaurant',tap:'the restaurant',es:'el restaurante'},\n      {id:'house',emoji:'🏠',en:'house',tap:'the house',es:'la casa'},\n      {id:'library',emoji:'📚',en:'library',tap:'the library',es:'la biblioteca'},\n      {id:'store',emoji:'🏪',en:'store',tap:'the store',es:'la tienda'}\n    ];\n    this.TURNS=[\n      {id:'left',emoji:'⬅️',en:'Turn left.',es:'Doble a la izquierda.'},\n      {id:'right',emoji:'➡️',en:'Turn right.',es:'Doble a la derecha.'},\n      {id:'straight',emoji:'⬆️',en:'Go straight.',es:'Siga derecho.'},\n      {id:'stop',emoji:'🛑',en:'Stop.',es:'Alto.'}\n    ];\n    // Andean-specific landmarks: how directions really work in small towns and rural mountain paths —\n    // people navigate by plaza, church, market, terminal, field, bridge (urban) and pass, fork, curve,\n    // river, ravine, antenna, cairn, cemetery (rural), not street names or compass directions.\n    this.LANDMARKS=[\n      {id:'plaza',emoji:'🏛️',en:'the main plaza',tap:'the main plaza',es:'la plaza central'},\n      {id:'church',emoji:'⛪',en:'the church',tap:'the church',es:'la iglesia'},\n      {id:'market',emoji:'🛒',en:'the market',tap:'the market',es:'el mercado'},\n      {id:'terminal',emoji:'🚌',en:'the bus terminal',tap:'the bus terminal',es:'el terminal de buses'},\n      {id:'field',emoji:'⚽',en:'the soccer field',tap:'the soccer field',es:'la cancha'},\n      {id:'bridge',emoji:'🌉',en:'the bridge',tap:'the bridge',es:'el puente'},\n      {id:'pass',emoji:'🏔️',en:'the mountain pass',tap:'the mountain pass',es:'el abra'},\n      {id:'fork',emoji:'🔀',en:'the fork in the road',tap:'the fork in the road',es:'la Y'},\n      {id:'curve',emoji:'🌀',en:'the curve',tap:'the curve',es:'la curva'},\n      {id:'river',emoji:'🌊',en:'the river',tap:'the river',es:'el río'},\n      {id:'ravine',emoji:'🏞️',en:'the ravine',tap:'the ravine',es:'la quebrada'},\n      {id:'antenna',emoji:'📡',en:'the antenna tower',tap:'the antenna tower',es:'la antena'},\n      {id:'cairn',emoji:'🪨',en:'the stone marker',tap:'the stone marker',es:'la apacheta'},\n      {id:'cemetery',emoji:'✝️',en:'the cemetery',tap:'the cemetery',es:'el cementerio'}\n    ];\n    // Ecuadorian volcano/province names — common street & avenue names in Andean towns\n    this.STREETS=['Sucre','Bolívar','Chimborazo','Cotopaxi','Imbabura','Cayambe','Otavalo'];\n  }\n\n  // ---- deck builders ----\n  buildPlaces(){\n    return this.shuffle(this.PLACES).slice(0,6).map(item=>{\n      const distract=this.sample(this.PLACES.filter(p=>p.id!==item.id),3);\n      const options=this.shuffle([item,...distract]);\n      return {type:'match', options, correctId:item.id,\n        speak:'Where is '+item.tap+'?', targetText:'Where is '+item.tap+'?', targetEs:'¿Dónde está '+item.es+'?'};\n    });\n  }\n  buildTurns(){\n    const deck=[];\n    for(let i=0;i<8;i++){\n      const item=this.TURNS[Math.floor(Math.random()*this.TURNS.length)];\n      deck.push({type:'match', options:this.TURNS, correctId:item.id,\n        speak:item.en, targetText:item.en, targetEs:item.es});\n    }\n    return deck;\n  }\n  buildBlocks(){\n    const nums=[1,2,3,4,5];\n    return this.shuffle(nums).concat(this.shuffle(nums).slice(0,3)).slice(0,8).map(n=>{\n      const item={id:'b'+n,text:String(n)};\n      const others=nums.filter(x=>x!==n).map(x=>({id:'b'+x,text:String(x)}));\n      const options=this.shuffle([item,...this.sample(others,3)]);\n      const w=this.numberToWords(n);\n      const useStreet=Math.random()<0.5;\n      const street=this.STREETS[Math.floor(Math.random()*this.STREETS.length)];\n      const enSuffix=useStreet? ' on '+street+' Street':'';\n      const esSuffix=useStreet? ' en la calle '+street:'';\n      return {type:'match', grid:'text', options, correctId:item.id,\n        speak:'Go straight '+w+' block'+(n>1?'s':'')+enSuffix+'.', targetText:'Go straight '+w+' block'+(n>1?'s':'')+enSuffix+'.', targetEs:'Siga derecho '+n+' cuadra'+(n>1?'s':'')+esSuffix+'.'};\n    });\n  }\n  buildLandmarks(){\n    return this.shuffle(this.LANDMARKS).slice(0,8).map(item=>{\n      const distract=this.sample(this.LANDMARKS.filter(p=>p.id!==item.id),3);\n      const options=this.shuffle([item,...distract]);\n      return {type:'match', options, correctId:item.id,\n        speak:'Where is '+item.tap+'?', targetText:'Where is '+item.tap+'?', targetEs:'¿Dónde está '+item.es+'?'};\n    });\n  }\n  buildUpDown(){\n    return this.shuffle(this.LANDMARKS).slice(0,8).map(it=>{\n      const dir=Math.random()<0.5?'up':'down';\n      const esVerb=dir==='up'?'Suba':'Baje';\n      return {type:'sort',\n        buckets:[{id:'up',emoji:'⬆️',labelEs:'Subir',labelEn:'Go up'},{id:'down',emoji:'⬇️',labelEs:'Bajar',labelEn:'Go down'}],\n        correctBucket:dir,\n        speak:'Go '+dir+' to '+it.tap+'.', targetText:'Go '+dir+' to '+it.tap+'.', targetEs:esVerb+' hacia '+it.es+'.'};\n    });\n  }\n  buildTapAll(){\n    const pool=[...this.PLACES,...this.LANDMARKS];\n    const deck=[];\n    for(let i=0;i<6;i++){\n      const grid=this.sample(pool,7);\n      const targets=this.sample(grid,3);\n      const names=targets.map(t=>t.tap);\n      const spoken='Tap '+names.slice(0,-1).join(', ')+', and '+names[names.length-1]+'.';\n      deck.push({type:'multi', options:this.shuffle(grid), correctIds:targets.map(t=>t.id), speak:spoken, targetText:spoken, targetEs:''});\n    }\n    return deck;\n  }\n  relationStyle(rel, aEmoji, bEmoji){\n    // a = target (subject of sentence), b = reference. Returns container/back/front styles + emoji order.\n    if(rel==='next_to'){\n      return {\n        containerStyle:{display:'flex',alignItems:'center',justifyContent:'center',gap:'10px',width:'100%',height:'72px'},\n        backStyle:{fontSize:'2.1rem',position:'static'}, backEmoji:bEmoji,\n        frontStyle:{fontSize:'2.1rem',position:'static'}, frontEmoji:aEmoji\n      };\n    }\n    if(rel==='in_front_of'){\n      return {\n        containerStyle:{position:'relative',width:'100%',height:'72px'},\n        backStyle:{position:'absolute',top:'2px',left:'8px',fontSize:'1.5rem',opacity:0.55,zIndex:1}, backEmoji:bEmoji,\n        frontStyle:{position:'absolute',bottom:'0px',right:'14px',fontSize:'2.3rem',zIndex:2}, frontEmoji:aEmoji\n      };\n    }\n    // behind\n    return {\n      containerStyle:{position:'relative',width:'100%',height:'72px'},\n      backStyle:{position:'absolute',top:'2px',left:'8px',fontSize:'1.5rem',opacity:0.55,zIndex:1}, backEmoji:aEmoji,\n      frontStyle:{position:'absolute',bottom:'0px',right:'14px',fontSize:'2.3rem',zIndex:2}, frontEmoji:bEmoji\n    };\n  }\n  buildPrepositions(){\n    const rels=[\n      {id:'next_to',en:'next to',es:'al lado de'},\n      {id:'in_front_of',en:'in front of',es:'enfrente de'},\n      {id:'behind',en:'behind',es:'detrás de'}\n    ];\n    const deck=[];\n    for(let i=0;i<8;i++){\n      const two=this.sample(this.PLACES,2);\n      const rel=rels[Math.floor(Math.random()*3)];\n      const options=this.shuffle(rels).map(r=>({id:r.id, relId:r.id, a:two[0].emoji, b:two[1].emoji}));\n      deck.push({type:'match', grid:'diagram', options, correctId:rel.id, relMeta:rels,\n        speak:'The '+two[0].en+' is '+rel.en+' the '+two[1].en+'.',\n        targetText:'The '+two[0].en+' is '+rel.en+' the '+two[1].en+'.',\n        targetEs:this.cap1(two[0].es)+' está '+rel.es+' '+two[1].es+'.'});\n    }\n    return deck;\n  }\n  buildRightLeft(){\n    return this.shuffle(this.PLACES).slice(0,8).map(it=>{\n      const side=Math.random()<0.5?'right':'left';\n      const esSide=side==='right'?'derecha':'izquierda';\n      return {type:'sort',\n        buckets:[{id:'right',emoji:'👉',labelEs:'Derecha',labelEn:'Right'},{id:'left',emoji:'👈',labelEs:'Izquierda',labelEn:'Left'}],\n        correctBucket:side,\n        speak:'The '+it.en+' will be on your '+side+'.',\n        targetText:'The '+it.en+' will be on your '+side+'.',\n        targetEs:this.cap1(it.es)+' estará a su '+esSide+'.'};\n    });\n  }\n\n  ACT={\n    places:{ en:'Los lugares', accent:'oklch(0.52 0.11 75)', instruction:'Escucha y toca el lugar correcto.', build:'buildPlaces', grid:'match' },\n    turns:{ en:'Las direcciones', accent:'oklch(0.46 0.10 255)', instruction:'Escucha y toca la flecha correcta.', build:'buildTurns', grid:'match' },\n    blocks:{ en:'¿Cuántas cuadras?', accent:'oklch(0.48 0.09 200)', instruction:'Escucha. ¿Cuántas cuadras oyes?', build:'buildBlocks', grid:'text' },\n    tapall:{ en:'Toca todo lo que oigas', accent:'oklch(0.56 0.12 40)', instruction:'Escucha la lista. Toca TODO lo que oigas.', build:'buildTapAll', grid:'multi' },\n    prepositions:{ en:'¿Dónde está?', accent:'oklch(0.48 0.10 150)', instruction:'Escucha la frase y toca el dibujo correcto.', build:'buildPrepositions', grid:'diagram' },\n    rightleft:{ en:'¿Derecha o izquierda?', accent:'oklch(0.52 0.13 355)', instruction:'Escucha. ¿Estará a la derecha o a la izquierda?', build:'buildRightLeft', grid:'sort' },\n    landmarks:{ en:'Puntos de referencia', accent:'oklch(0.50 0.09 90)', instruction:'Escucha y toca el punto de referencia correcto.', build:'buildLandmarks', grid:'match' },\n    updown:{ en:'¿Subir o bajar?', accent:'oklch(0.44 0.10 230)', instruction:'Escucha. ¿Hay que subir o bajar?', build:'buildUpDown', grid:'sort' }\n  };\n\n  // ---- audio ----\n  pickVoice(lang){\n    const list=this.voiceList||[]; if(!list.length) return null;\n    const prefix=lang.split('-')[0].toLowerCase();\n    const cands=list.filter(v=>v.lang.toLowerCase().startsWith(prefix));\n    if(!cands.length) return null;\n    const hints=['Enhanced','Premium','Neural','Natural','Siri'];\n    let pick=cands.find(v=>hints.some(h=>v.name.includes(h)));\n    if(!pick) pick=cands.find(v=>v.lang.toLowerCase()===lang.toLowerCase());\n    return pick||cands[0];\n  }\n  say(text,lang){\n    if(!('speechSynthesis' in window)) return;\n    const u=new SpeechSynthesisUtterance(text);\n    u.lang=lang||'en-US'; const v=this.pickVoice(u.lang); if(v) u.voice=v;\n    u.rate=0.86; u.pitch=1; u.volume=1;\n    window.speechSynthesis.speak(u);\n  }\n  speak(payload){\n    if(!('speechSynthesis' in window)) return;\n    window.speechSynthesis.cancel();\n    if(Array.isArray(payload)) payload.forEach(p=>this.say(p.text,p.lang));\n    else this.say(payload,'en-US');\n  }\n  speakCurrent(){ const q=this.state.deck[this.state.idx]; if(q) this.speak(q.speak); }\n\n  // ---- engine ----\n  start(key){\n    this.buildData();\n    const deck=this[this.ACT[key].build]();\n    this.setState({screen:'play', activityKey:key, deck, idx:0, phase:'listening', selected:[], checked:false, correctCount:0});\n    this.speak(deck[0].speak);\n  }\n  pickMatch(id){\n    if(this.state.phase==='answered') return;\n    const q=this.state.deck[this.state.idx];\n    const ok=id===q.correctId;\n    this.setState(s=>({selected:[id], phase:'answered', correctCount:s.correctCount+(ok?1:0)}));\n    this.speak(q.speak);\n  }\n  toggleMulti(id){\n    if(this.state.checked) return;\n    this.setState(s=>({selected: s.selected.includes(id)? s.selected.filter(x=>x!==id) : [...s.selected,id]}));\n  }\n  checkMulti(){\n    const q=this.state.deck[this.state.idx];\n    const ok=this.setEqual(this.state.selected,q.correctIds);\n    this.setState(s=>({checked:true, correctCount:s.correctCount+(ok?1:0)}));\n    this.speak(q.speak);\n  }\n  pickSort(bucket){\n    if(this.state.phase==='answered') return;\n    const q=this.state.deck[this.state.idx];\n    const ok=bucket===q.correctBucket;\n    this.setState(s=>({selected:[bucket], phase:'answered', correctCount:s.correctCount+(ok?1:0)}));\n    this.speak(q.speak);\n  }\n  next(){\n    const {idx,deck}=this.state;\n    if(idx+1>=deck.length){ this.setState({screen:'end'}); return; }\n    const ni=idx+1;\n    this.setState({idx:ni, phase:'listening', selected:[], checked:false});\n    this.speak(deck[ni].speak);\n  }\n  restart(){ this.start(this.state.activityKey); }\n  home(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); this.setState({screen:'home'}); }\n\n  renderVals(){\n    const s=this.state;\n    const base={\n      isHome:s.screen==='home', isPlay:s.screen==='play', isEnd:s.screen==='end',\n      openPlaces:()=>this.start('places'),\n      openTurns:()=>this.start('turns'),\n      openBlocks:()=>this.start('blocks'),\n      openTapAll:()=>this.start('tapall'),\n      openPrepositions:()=>this.start('prepositions'),\n      openRightLeft:()=>this.start('rightleft'),\n      openLandmarks:()=>this.start('landmarks'),\n      openUpDown:()=>this.start('updown'),\n      backHome:()=>this.home(),\n      options:[], buckets:[]\n    };\n\n    if(s.screen==='end'){\n      const total=s.deck.length, c=s.correctCount, pct=total?Math.round(c/total*100):0;\n      let msg; if(pct===100) msg='¡Perfecto! Lo dominas. 🌟'; else if(pct>=70) msg='¡Muy bien! Vas por buen camino.'; else msg='¡Buen intento! Escucha y practica otra vez.';\n      const accent=(this.ACT[s.activityKey]||{}).accent||'#2A2622';\n      return Object.assign(base,{\n        endTitle:'¡Terminaste!', endScore:c+' / '+total, endMsg:msg,\n        endScoreStyle:{fontFamily:\"'Fraunces',serif\",fontWeight:700,fontSize:'2.4rem',color:accent,margin:'6px 0'},\n        retryStyle:{background:accent,color:'#fff',border:'none',borderRadius:'14px',padding:'12px 22px',cursor:'pointer',fontFamily:\"'Space Mono',monospace\",fontWeight:700,fontSize:'0.82rem'},\n        retryOnClick:()=>this.restart(), homeOnClick:()=>this.home()\n      });\n    }\n\n    if(s.screen!=='play') return Object.assign(base,{isHome:true});\n\n    const meta=this.ACT[s.activityKey];\n    const accent=meta.accent;\n    const q=s.deck[s.idx];\n    const gridType=q.grid||meta.grid;\n    const answered = q.type==='multi' ? s.checked : s.phase==='answered';\n    const total=s.deck.length;\n\n    const optBase={position:'relative',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'8px',minHeight:'106px',padding:'12px 10px',background:'#fff',border:'2px solid #E7DFD2',borderRadius:'16px',boxShadow:'0 3px 10px rgba(42,38,34,0.05)',cursor:'pointer',color:'#2A2622',fontFamily:\"'Fraunces',serif\",transition:'transform .08s ease'};\n    const correctStyle={background:'oklch(0.95 0.04 150)',border:'2px solid oklch(0.60 0.11 150)',boxShadow:'0 3px 10px rgba(42,38,34,0.05)'};\n    const wrongStyle={background:'oklch(0.95 0.05 30)',border:'2px solid oklch(0.62 0.14 30)',boxShadow:'0 3px 10px rgba(42,38,34,0.05)'};\n    const dimStyle={opacity:0.45};\n\n    let vm={\n      activityTitle:meta.en, instruction:meta.instruction,\n      progressText:(s.idx+1)+' / '+total,\n      barStyle:{height:'100%',width:(((s.idx+(answered?1:0))/total)*100)+'%',background:accent,borderRadius:'99px',transition:'width .3s ease'},\n      listenOnClick:()=>this.speakCurrent(),\n      listenStyle:{display:'flex',flexDirection:'column',alignItems:'center',gap:'8px',width:'100%',maxWidth:'340px',padding:'22px',background:'#fff',border:'2px solid '+accent,borderRadius:'20px',boxShadow:'0 5px 16px rgba(42,38,34,0.08)',cursor:'pointer',color:'#2A2622'},\n      pulseStyle:{position:'absolute',inset:'0',borderRadius:'50%',background:accent,opacity:0.3,animation:'soundpulse 1.8s ease-out infinite'},\n      isSort:q.type==='sort',\n      showGrid:q.type!=='sort',\n      isMulti:q.type==='multi'\n    };\n\n    let fbCorrect=false;\n    if(answered){\n      if(q.type==='match') fbCorrect=s.selected[0]===q.correctId;\n      else if(q.type==='sort') fbCorrect=s.selected[0]===q.correctBucket;\n      else fbCorrect=this.setEqual(s.selected,q.correctIds);\n    }\n    vm.feedbackShow=answered;\n    vm.feedbackStyle={background: fbCorrect?'oklch(0.96 0.03 150)':'oklch(0.96 0.04 30)', border:'2px solid '+(fbCorrect?'oklch(0.70 0.09 150)':'oklch(0.72 0.11 30)'), borderRadius:'16px', padding:'14px 16px', textAlign:'center', marginTop:'6px', animation:'popin .2s ease'};\n    vm.feedbackMsg = fbCorrect ? '✓  ¡Muy bien!' : '✋  Casi. Escucha de nuevo:';\n    vm.feedbackReveal = q.targetText;\n    vm.hasRevealEs = !!q.targetEs;\n    vm.feedbackRevealEs = q.targetEs;\n\n    vm.nextShow = answered;\n    vm.nextLabel = (s.idx+1>=total) ? 'Ver resultado' : 'Siguiente ▸';\n    vm.nextOnClick = ()=>this.next();\n    vm.nextStyle = {background:accent,color:'#fff',border:'none',borderRadius:'16px',padding:'13px 30px',cursor:'pointer',fontFamily:\"'Space Mono',monospace\",fontWeight:700,fontSize:'0.9rem',boxShadow:'0 4px 12px rgba(42,38,34,0.12)'};\n\n    if(q.type==='sort'){\n      const selB=s.selected[0];\n      vm.buckets=q.buckets.map(bk=>{\n        let st=Object.assign({display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'6px',minHeight:'128px',background:'#fff',border:'2px solid #E7DFD2',borderRadius:'18px',boxShadow:'0 3px 10px rgba(42,38,34,0.05)',cursor:'pointer',color:'#2A2622',fontFamily:\"'Fraunces',serif\"});\n        if(answered){ if(bk.id===q.correctBucket) st=Object.assign(st,correctStyle); else if(bk.id===selB) st=Object.assign(st,wrongStyle); else st=Object.assign(st,dimStyle); }\n        return {emoji:bk.emoji,labelEs:bk.labelEs,labelEn:bk.labelEn,style:st,disabled:answered,onClick:()=>this.pickSort(bk.id)};\n      });\n      return Object.assign(base,vm);\n    }\n\n    const isMulti=q.type==='multi';\n    const isText = gridType==='text';\n    const isDiagram = gridType==='diagram';\n    let cols;\n    if(gridType==='multi') cols='repeat(auto-fill, minmax(88px, 1fr))';\n    else if(isDiagram) cols='repeat(3, 1fr)';\n    else cols='repeat(2, 1fr)';\n    vm.optionsGridStyle={display:'grid',gridTemplateColumns:cols,gap:'11px'};\n\n    const prepLabel = q.relMeta ? Object.fromEntries(q.relMeta.map(r=>[r.id,{en:r.en,es:r.es}])) : {};\n\n    vm.options=q.options.map(item=>{\n      const sel=s.selected.includes(item.id);\n      let st=Object.assign({},optBase);\n      let showCaption=false;\n      if(isMulti){\n        if(!s.checked){ if(sel) st=Object.assign(st,{border:'2px solid '+accent,background:'#fffdf8'}); }\n        else { if(q.correctIds.includes(item.id)) st=Object.assign(st,correctStyle); else if(sel) st=Object.assign(st,wrongStyle); else st=Object.assign(st,dimStyle); showCaption=true; }\n      } else {\n        if(answered){ if(item.id===q.correctId) st=Object.assign(st,correctStyle); else if(item.id===s.selected[0]) st=Object.assign(st,wrongStyle); else st=Object.assign(st,dimStyle); if(!isDiagram) showCaption=true; }\n      }\n      const textStyle={fontFamily:\"'Space Mono',monospace\",fontWeight:700,fontSize:'1.9rem'};\n\n      let diagVals={};\n      if(isDiagram){\n        const rs=this.relationStyle(item.relId, item.a, item.b);\n        diagVals={\n          diagContainerStyle:rs.containerStyle,\n          diagBackStyle:rs.backStyle, diagBackEmoji:rs.backEmoji,\n          diagFrontStyle:rs.frontStyle, diagFrontEmoji:rs.frontEmoji\n        };\n        showCaption = answered;\n      }\n\n      return {\n        isEmoji:!isText && !isDiagram, isText, isDiagram,\n        emoji:item.emoji, text:item.text||item.en, textStyle,\n        showCaption, caption: isDiagram ? ((prepLabel[item.relId]||{}).en||'') : item.en,\n        style:st, disabled: isMulti? s.checked : answered,\n        onClick: isMulti? (()=>this.toggleMulti(item.id)) : (()=>this.pickMatch(item.id)),\n        ...diagVals\n      };\n    });\n\n    vm.showCheck = isMulti && !s.checked;\n    vm.checkDisabled = s.selected.length===0;\n    vm.checkOnClick = ()=>this.checkMulti();\n    vm.checkStyle = {display:'block',width:'100%',marginTop:'14px',background: s.selected.length? accent:'#EDE6DA',color: s.selected.length?'#fff':'#a99f8d',border:'none',borderRadius:'16px',padding:'14px',cursor: s.selected.length?'pointer':'default',fontFamily:\"'Space Mono',monospace\",fontWeight:700,fontSize:'0.9rem'};\n\n    return Object.assign(base,vm);\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
