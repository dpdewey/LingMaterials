  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nospace;font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.52 0.13 355);margin-bottom:2px;\">Clasifica<\u002Fspan>\n          <span style=\"display:block;font-weight:600;font-size:1.12rem;line-height:1.15;\">¿Él o ella?<\u002Fspan>\n          <span style=\"display:block;font-family:'Space Mono',monospace;font-size:0.74rem;color:#8a8073;\">This is my… ¿es hombre o mujer?<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"flex:none;font-size:1.1rem;color:#c3b8a6;\">▸<\u002Fspan>\n      <\u002Fbutton>\n\n      <button onclick=\"{{ openMonths }}\" style=\"display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:#fff;border:2px solid #E7DFD2;border-radius:18px;box-shadow:0 4px 14px rgba(42,38,34,0.06);padding:16px;cursor:pointer;color:#2A2622;\">\n        <span style=\"flex:none;width:52px;height:52px;border-radius:14px;background:oklch(0.94 0.03 75);display:flex;align-items:center;justify-content:center;font-size:1.7rem;\">🎂<\u002Fspan>\n        <span style=\"flex:1;min-width:0;\">\n          <span style=\"display:block;font-family:'Space Mono',monospace;font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.48 0.11 75);margin-bottom:2px;\">Toca el mes<\u002Fspan>\n          <span style=\"display:block;font-weight:600;font-size:1.12rem;line-height:1.15;\">El cumpleaños<\u002Fspan>\n          <span style=\"display:block;font-family:'Space Mono',monospace;font-size:0.74rem;color:#8a8073;\">My birthday is in… ¿qué mes oyes?<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"flex:none;font-size:1.1rem;color:#c3b8a6;\">▸<\u002Fspan>\n      <\u002Fbutton>\n\n    <\u002Fdiv>\n\n    <p style=\"text-align:center;font-family:'Space Mono',monospace;font-size:0.68rem;color:#b3a894;margin-top:32px;\">Teach for Success · Día 3<\u002Fp>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPlay }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px;\">\n      <button onclick=\"{{ backHome }}\" style=\"flex:none;background:#fff;border:2px solid #E7DFD2;border-radius:12px;padding:8px 12px;cursor:pointer;font-family:'Space Mono',monospace;font-size:0.72rem;color:#2A2622;\">‹ Menú<\u002Fbutton>\n      <div style=\"flex:1;\">\n        <div style=\"font-family:'Space Mono',monospace;font-size:0.66rem;letter-spacing:0.1em;color:#8a8073;margin-bottom:5px;\">{{ activityTitle }} · {{ progressText }}<\u002Fdiv>\n        <div style=\"height:7px;background:#EDE6DA;border-radius:99px;overflow:hidden;\"><div style=\"{{ barStyle }}\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"text-align:center;font-family:'Fraunces',serif;font-weight:500;font-size:1.12rem;line-height:1.35;margin:0 0 16px;\">{{ instruction }}<\u002Fp>\n\n    <div style=\"display:flex;justify-content:center;margin-bottom:22px;\">\n      <button onclick=\"{{ listenOnClick }}\" style=\"{{ listenStyle }}\">\n        <span style=\"position:relative;display:flex;align-items:center;justify-content:center;width:60px;height:60px;\">\n          <span style=\"{{ pulseStyle }}\"><\u002Fspan>\n          <span style=\"position:relative;font-size:2rem;\">🔊<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-family:'Space Mono',monospace;font-size:0.74rem;letter-spacing:0.06em;\">Escuchar otra vez<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isSort }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;\">\n      <sc-for list=\"{{ buckets }}\" as=\"bk\" hint-placeholder-count=\"2\">\n        <button onclick=\"{{ bk.onClick }}\" disabled=\"{{ bk.disabled }}\" style=\"{{ bk.style }}\">\n          <span style=\"{{ bk.emojiStyle }}\">{{ bk.emoji }}<\u002Fspan>\n          <span style=\"font-weight:600;font-size:1.05rem;\">{{ bk.labelEs }}<\u002Fspan>\n          <span style=\"font-family:'Space Mono',monospace;font-size:0.68rem;color:#8a8073;\">{{ bk.labelEn }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showGrid }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"{{ optionsGridStyle }}\">\n      <sc-for list=\"{{ options }}\" as=\"opt\" hint-placeholder-count=\"4\">\n        <button onclick=\"{{ opt.onClick }}\" disabled=\"{{ opt.disabled }}\" style=\"{{ opt.style }}\">\n          <sc-if value=\"{{ opt.isEmoji }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:2.7rem;line-height:1;\">{{ opt.emoji }}<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ opt.isText }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ opt.textStyle }}\">{{ opt.text }}<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ opt.showCaption }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;color:#6b6257;text-align:center;line-height:1.15;\">{{ opt.caption }}<\u002Fspan><\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showCheck }}\" hint-placeholder-val=\"{{ false }}\">\n    <button onclick=\"{{ checkOnClick }}\" disabled=\"{{ checkDisabled }}\" style=\"{{ checkStyle }}\">Comprobar ✓<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ feedbackShow }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"{{ feedbackStyle }}\">\n      <div style=\"font-family:'Space Mono',monospace;font-weight:700;font-size:0.92rem;\">{{ feedbackMsg }}<\u002Fdiv>\n      <div style=\"font-family:'Fraunces',serif;font-weight:600;font-size:1.25rem;margin-top:4px;\">{{ feedbackReveal }}<\u002Fdiv>\n      <sc-if value=\"{{ hasRevealEs }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-family:'Fraunces',serif;font-style:italic;font-size:0.98rem;color:#6b6257;margin-top:2px;\">{{ feedbackRevealEs }}<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ nextShow }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;justify-content:center;margin-top:18px;\">\n      <button onclick=\"{{ nextOnClick }}\" style=\"{{ nextStyle }}\">{{ nextLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isEnd }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"text-align:center;padding-top:24px;\">\n    <div style=\"background:#fff;border:2px solid #E7DFD2;border-radius:22px;box-shadow:0 6px 20px rgba(42,38,34,0.08);padding:32px 24px;\">\n      <div style=\"font-size:2.6rem;margin-bottom:6px;\">🎉<\u002Fdiv>\n      <h2 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:1.5rem;margin:0 0 6px;\">{{ endTitle }}<\u002Fh2>\n      <div style=\"{{ endScoreStyle }}\">{{ endScore }}<\u002Fdiv>\n      <p style=\"font-family:'Space Mono',monospace;font-size:0.85rem;color:#6b6257;margin:8px 0 0;\">{{ endMsg }}<\u002Fp>\n      <div style=\"display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap;\">\n        <button onclick=\"{{ retryOnClick }}\" style=\"{{ retryStyle }}\">Repetir 🔄<\u002Fbutton>\n        <button onclick=\"{{ homeOnClick }}\" style=\"background:#fff;border:2px solid #E7DFD2;border-radius:14px;padding:12px 20px;cursor:pointer;font-family:'Space Mono',monospace;font-weight:700;font-size:0.82rem;color:#2A2622;\">Menú<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { screen:'home', activityKey:null, deck:[], idx:0, phase:'listening', selected:[], checked:false, correctCount:0 };\n\n  componentDidMount(){\n    this.voiceList=[];\n    const load=()=>{ if('speechSynthesis' in window) this.voiceList=window.speechSynthesis.getVoices(); };\n    load();\n    if('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged=load;\n    this.buildData();\n  }\n\n  shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }\n  sample(arr,n){ return this.shuffle(arr).slice(0,n); }\n  setEqual(a,b){ return a.length===b.length && a.every(x=>b.includes(x)); }\n\n  numberToWords(n){\n    const ones=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];\n    const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];\n    if(n<20) return ones[n];\n    const t=Math.floor(n/10), o=n%10;\n    return o===0? tens[t] : tens[t]+'-'+ones[o];\n  }\n\n  buildData(){\n    if(this._built) return; this._built=true;\n    // Distinct-emoji set for tap-the-picture and tap-all (each image must be unique)\n    this.FAMILY_PIC=[\n      {id:'father',emoji:'👨',en:'father',tap:'the father',es:'el papá',gender:'m'},\n      {id:'mother',emoji:'👩',en:'mother',tap:'the mother',es:'la mamá',gender:'f'},\n      {id:'brother',emoji:'👦',en:'brother',tap:'the brother',es:'el hermano',gender:'m'},\n      {id:'sister',emoji:'👧',en:'sister',tap:'the sister',es:'la hermana',gender:'f'},\n      {id:'grandfather',emoji:'👴',en:'grandfather',tap:'the grandfather',es:'el abuelo',gender:'m'},\n      {id:'grandmother',emoji:'👵',en:'grandmother',tap:'the grandmother',es:'la abuela',gender:'f'},\n      {id:'baby',emoji:'👶',en:'baby',tap:'the baby',es:'el bebé',gender:'m'},\n      {id:'family',emoji:'👪',en:'family',tap:'the family',es:'la familia',gender:'m'}\n    ];\n    // Full set for spoken sort (one per card, so shared emoji are fine)\n    this.FAMILY_ALL=[\n      {id:'father',en:'father',es:'el papá',gender:'m'},\n      {id:'mother',en:'mother',es:'la mamá',gender:'f'},\n      {id:'brother',en:'brother',es:'el hermano',gender:'m'},\n      {id:'sister',en:'sister',es:'la hermana',gender:'f'},\n      {id:'son',en:'son',es:'el hijo',gender:'m'},\n      {id:'daughter',en:'daughter',es:'la hija',gender:'f'},\n      {id:'grandfather',en:'grandfather',es:'el abuelo',gender:'m'},\n      {id:'grandmother',en:'grandmother',es:'la abuela',gender:'f'},\n      {id:'uncle',en:'uncle',es:'el tío',gender:'m'},\n      {id:'aunt',en:'aunt',es:'la tía',gender:'f'}\n    ];\n    this.MONTHS=[\n      {id:'jan',en:'January',es:'enero'},{id:'feb',en:'February',es:'febrero'},\n      {id:'mar',en:'March',es:'marzo'},{id:'apr',en:'April',es:'abril'},\n      {id:'may',en:'May',es:'mayo'},{id:'jun',en:'June',es:'junio'},\n      {id:'jul',en:'July',es:'julio'},{id:'aug',en:'August',es:'agosto'},\n      {id:'sep',en:'September',es:'septiembre'},{id:'oct',en:'October',es:'octubre'},\n      {id:'nov',en:'November',es:'noviembre'},{id:'dec',en:'December',es:'diciembre'}\n    ];\n  }\n\n  // ---- deck builders ----\n  buildFamily(){\n    return this.shuffle(this.FAMILY_PIC).slice(0,8).map(item=>{\n      const distract=this.sample(this.FAMILY_PIC.filter(p=>p.id!==item.id),3);\n      const options=this.shuffle([item,...distract]);\n      return {type:'match', options, correctId:item.id,\n        speak:'This is '+item.tap+'.', targetText:'This is '+item.tap+'.', targetEs:'Este es '+item.es+'.'};\n    });\n  }\n  cap(str){ return str.charAt(0).toUpperCase()+str.slice(1); }\n  descPairs(){\n    // Neutral, non-sensitive contrasts. esf = fem. form, esm = masc. form, size scales the figure.\n    return [\n      [{id:'tall',en:'tall',esf:'alta',esm:'alto',emoji:'🧍',size:'big'},   {id:'short',en:'short',esf:'baja',esm:'bajo',emoji:'🧍',size:'small'}],\n      [{id:'big',en:'big',esf:'grande',esm:'grande',emoji:'🧍',size:'big'}, {id:'small',en:'small',esf:'pequeña',esm:'pequeño',emoji:'🧒',size:'small'}],\n      [{id:'young',en:'young',esf:'joven',esm:'joven',emoji:'🧒'},          {id:'old',en:'old',esf:'mayor',esm:'mayor',emoji:'🧓'}],\n      [{id:'ecuadorian',en:'Ecuadorian',esf:'ecuatoriana',esm:'ecuatoriano',emoji:'🇪🇨'}, {id:'american',en:'American',esf:'estadounidense',esm:'estadounidense',emoji:'🇺🇸'}],\n      [{id:'german',en:'German',esf:'alemana',esm:'alemán',emoji:'🇩🇪'},    {id:'french',en:'French',esf:'francesa',esm:'francés',emoji:'🇫🇷'}],\n      [{id:'ecuadorian',en:'Ecuadorian',esf:'ecuatoriana',esm:'ecuatoriano',emoji:'🇪🇨'}, {id:'chinese',en:'Chinese',esf:'china',esm:'chino',emoji:'🇨🇳'}],\n      [{id:'colombian',en:'Colombian',esf:'colombiana',esm:'colombiano',emoji:'🇨🇴'},     {id:'peruvian',en:'Peruvian',esf:'peruana',esm:'peruano',emoji:'🇵🇪'}]\n    ];\n  }\n  buildTallShort(){\n    const subj=[{p:'She',es:'Ella'},{p:'He',es:'Él'}];\n    const pairs=this.descPairs();\n    const order=this.shuffle(pairs.map((_,i)=>i));\n    const deck=[];\n    for(let i=0;i<8;i++){\n      const pair=pairs[order[i%order.length]];\n      const s=subj[Math.floor(Math.random()*2)];\n      const correct=pair[Math.floor(Math.random()*2)];\n      const gEs=(o)=> s.p==='She'? o.esf : o.esm;\n      const bucket=(o)=>({id:o.id, emoji:o.emoji, emojiBig:o.size==='big', emojiSmall:o.size==='small', labelEs:this.cap(gEs(o)), labelEn:o.en});\n      deck.push({type:'sort',\n        buckets:[bucket(pair[0]),bucket(pair[1])],\n        correctBucket:correct.id,\n        speak:s.p+' is '+correct.en+'.', targetText:s.p+' is '+correct.en+'.', targetEs:s.es+' es '+gEs(correct)+'.'});\n    }\n    return deck;\n  }\n  buildAge(){\n    const nums=new Set(); while(nums.size<8) nums.add(2+Math.floor(Math.random()*88));\n    const items=[...nums].map(n=>({id:String(n),text:String(n),en:this.numberToWords(n)}));\n    const subj=[{p:'She',es:'Ella'},{p:'He',es:'Él'}];\n    return this.shuffle(items).map(item=>{\n      const distract=this.sample(items.filter(p=>p.id!==item.id),3);\n      const options=this.shuffle([item,...distract]);\n      const s=subj[Math.floor(Math.random()*2)];\n      return {type:'match', grid:'text', options, correctId:item.id,\n        speak:s.p+' is '+item.en+' years old.', targetText:s.p+' is '+item.en+' years old.', targetEs:s.es+' tiene '+item.id+' años.'};\n    });\n  }\n  buildTapAll(){\n    const deck=[];\n    for(let i=0;i<6;i++){\n      const grid=this.sample(this.FAMILY_PIC,7);\n      const targets=this.sample(grid,3);\n      const names=targets.map(t=>t.tap);\n      const spoken='Tap '+names.slice(0,-1).join(', ')+', and '+names[names.length-1]+'.';\n      deck.push({type:'multi', options:this.shuffle(grid), correctIds:targets.map(t=>t.id), speak:spoken, targetText:spoken, targetEs:''});\n    }\n    return deck;\n  }\n  buildHeShe(){\n    return this.shuffle(this.FAMILY_ALL).slice(0,8).map(it=>({\n      type:'sort',\n      buckets:[{id:'m',emoji:'👨',labelEs:'Él',labelEn:'He / his'},{id:'f',emoji:'👩',labelEs:'Ella',labelEn:'She / her'}],\n      correctBucket:it.gender,\n      speak:'This is my '+it.en+'.', targetText:'This is my '+it.en+'.', targetEs:(it.gender==='m'?'Este es ':'Esta es ')+it.es+'.'\n    }));\n  }\n  buildMonths(){\n    return this.shuffle(this.MONTHS).slice(0,8).map(item=>{\n      const distract=this.sample(this.MONTHS.filter(p=>p.id!==item.id),3);\n      const options=this.shuffle([item,...distract]);\n      return {type:'match', grid:'monthtext', options, correctId:item.id,\n        speak:'My birthday is in '+item.en+'.', targetText:'My birthday is in '+item.en+'.', targetEs:'Mi cumpleaños es en '+item.es+'.'};\n    });\n  }\n\n  ACT={\n    family:{ en:'La familia', accent:'oklch(0.50 0.10 255)', instruction:'Escucha y toca a la persona correcta.', build:'buildFamily', grid:'match' },\n    tallshort:{ en:'¿Cómo es?', accent:'oklch(0.54 0.10 150)', instruction:'Escucha la frase y toca la palabra correcta.', build:'buildTallShort', grid:'sort' },\n    age:{ en:'La edad', accent:'oklch(0.52 0.09 200)', instruction:'Escucha. ¿Qué edad oyes?', build:'buildAge', grid:'text' },\n    tapall:{ en:'Toca todo lo que oigas', accent:'oklch(0.56 0.12 40)', instruction:'Escucha la lista. Toca TODO lo que oigas.', build:'buildTapAll', grid:'multi' },\n    heshe:{ en:'¿Él o ella?', accent:'oklch(0.56 0.12 355)', instruction:'Escucha. ¿Es hombre (él) o mujer (ella)?', build:'buildHeShe', grid:'sort' },\n    months:{ en:'El cumpleaños', accent:'oklch(0.56 0.11 75)', instruction:'Escucha. ¿En qué mes es el cumpleaños?', build:'buildMonths', grid:'monthtext' }\n  };\n\n  // ---- audio ----\n  pickVoice(lang){\n    const list=this.voiceList||[]; if(!list.length) return null;\n    const prefix=lang.split('-')[0].toLowerCase();\n    const cands=list.filter(v=>v.lang.toLowerCase().startsWith(prefix));\n    if(!cands.length) return null;\n    const hints=['Enhanced','Premium','Neural','Natural','Siri'];\n    let pick=cands.find(v=>hints.some(h=>v.name.includes(h)));\n    if(!pick) pick=cands.find(v=>v.lang.toLowerCase()===lang.toLowerCase());\n    return pick||cands[0];\n  }\n  say(text,lang){\n    if(!('speechSynthesis' in window)) return;\n    const u=new SpeechSynthesisUtterance(text);\n    u.lang=lang||'en-US'; const v=this.pickVoice(u.lang); if(v) u.voice=v;\n    u.rate=0.86; u.pitch=1; u.volume=1;\n    window.speechSynthesis.speak(u);\n  }\n  speak(payload){\n    if(!('speechSynthesis' in window)) return;\n    window.speechSynthesis.cancel();\n    if(Array.isArray(payload)) payload.forEach(p=>this.say(p.text,p.lang));\n    else this.say(payload,'en-US');\n  }\n  speakCurrent(){ const q=this.state.deck[this.state.idx]; if(q) this.speak(q.speak); }\n\n  // ---- engine ----\n  start(key){\n    this.buildData();\n    const deck=this[this.ACT[key].build]();\n    this.setState({screen:'play', activityKey:key, deck, idx:0, phase:'listening', selected:[], checked:false, correctCount:0});\n    this.speak(deck[0].speak);\n  }\n  pickMatch(id){\n    if(this.state.phase==='answered') return;\n    const q=this.state.deck[this.state.idx];\n    const ok=id===q.correctId;\n    this.setState(s=>({selected:[id], phase:'answered', correctCount:s.correctCount+(ok?1:0)}));\n    this.speak(q.speak);\n  }\n  toggleMulti(id){\n    if(this.state.checked) return;\n    this.setState(s=>({selected: s.selected.includes(id)? s.selected.filter(x=>x!==id) : [...s.selected,id]}));\n  }\n  checkMulti(){\n    const q=this.state.deck[this.state.idx];\n    const ok=this.setEqual(this.state.selected,q.correctIds);\n    this.setState(s=>({checked:true, correctCount:s.correctCount+(ok?1:0)}));\n    this.speak(q.speak);\n  }\n  pickSort(bucket){\n    if(this.state.phase==='answered') return;\n    const q=this.state.deck[this.state.idx];\n    const ok=bucket===q.correctBucket;\n    this.setState(s=>({selected:[bucket], phase:'answered', correctCount:s.correctCount+(ok?1:0)}));\n    this.speak(q.speak);\n  }\n  next(){\n    const {idx,deck}=this.state;\n    if(idx+1>=deck.length){ this.setState({screen:'end'}); return; }\n    const ni=idx+1;\n    this.setState({idx:ni, phase:'listening', selected:[], checked:false});\n    this.speak(deck[ni].speak);\n  }\n  restart(){ this.start(this.state.activityKey); }\n  home(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); this.setState({screen:'home'}); }\n\n  renderVals(){\n    const s=this.state;\n    const base={\n      isHome:s.screen==='home', isPlay:s.screen==='play', isEnd:s.screen==='end',\n      openFamily:()=>this.start('family'),\n      openTallShort:()=>this.start('tallshort'),\n      openAge:()=>this.start('age'),\n      openTapAll:()=>this.start('tapall'),\n      openHeShe:()=>this.start('heshe'),\n      openMonths:()=>this.start('months'),\n      backHome:()=>this.home(),\n      options:[], buckets:[]\n    };\n\n    if(s.screen==='end'){\n      const total=s.deck.length, c=s.correctCount, pct=total?Math.round(c/total*100):0;\n      let msg; if(pct===100) msg='¡Perfecto! Lo dominas. 🌟'; else if(pct>=70) msg='¡Muy bien! Vas por buen camino.'; else msg='¡Buen intento! Escucha y practica otra vez.';\n      const accent=(this.ACT[s.activityKey]||{}).accent||'#2A2622';\n      return Object.assign(base,{\n        endTitle:'¡Terminaste!', endScore:c+' / '+total, endMsg:msg,\n        endScoreStyle:{fontFamily:\"'Fraunces',serif\",fontWeight:700,fontSize:'2.4rem',color:accent,margin:'6px 0'},\n        retryStyle:{background:accent,color:'#fff',border:'none',borderRadius:'14px',padding:'12px 22px',cursor:'pointer',fontFamily:\"'Space Mono',monospace\",fontWeight:700,fontSize:'0.82rem'},\n        retryOnClick:()=>this.restart(), homeOnClick:()=>this.home()\n      });\n    }\n\n    if(s.screen!=='play') return Object.assign(base,{isHome:true});\n\n    const meta=this.ACT[s.activityKey];\n    const accent=meta.accent;\n    const q=s.deck[s.idx];\n    const gridType=q.grid||meta.grid;\n    const answered = q.type==='multi' ? s.checked : s.phase==='answered';\n    const total=s.deck.length;\n\n    const optBase={position:'relative',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'8px',minHeight:'106px',padding:'12px 10px',background:'#fff',border:'2px solid #E7DFD2',borderRadius:'16px',boxShadow:'0 3px 10px rgba(42,38,34,0.05)',cursor:'pointer',color:'#2A2622',fontFamily:\"'Fraunces',serif\",transition:'transform .08s ease'};\n    const correctStyle={background:'oklch(0.95 0.04 150)',border:'2px solid oklch(0.60 0.11 150)',boxShadow:'0 3px 10px rgba(42,38,34,0.05)'};\n    const wrongStyle={background:'oklch(0.95 0.05 30)',border:'2px solid oklch(0.62 0.14 30)',boxShadow:'0 3px 10px rgba(42,38,34,0.05)'};\n    const dimStyle={opacity:0.45};\n\n    let vm={\n      activityTitle:meta.en, instruction:meta.instruction,\n      progressText:(s.idx+1)+' / '+total,\n      barStyle:{height:'100%',width:(((s.idx+(answered?1:0))/total)*100)+'%',background:accent,borderRadius:'99px',transition:'width .3s ease'},\n      listenOnClick:()=>this.speakCurrent(),\n      listenStyle:{display:'flex',flexDirection:'column',alignItems:'center',gap:'8px',width:'100%',maxWidth:'340px',padding:'22px',background:'#fff',border:'2px solid '+accent,borderRadius:'20px',boxShadow:'0 5px 16px rgba(42,38,34,0.08)',cursor:'pointer',color:'#2A2622'},\n      pulseStyle:{position:'absolute',inset:'0',borderRadius:'50%',background:accent,opacity:0.3,animation:'soundpulse 1.8s ease-out infinite'},\n      isSort:q.type==='sort',\n      showGrid:q.type!=='sort',\n      isMulti:q.type==='multi'\n    };\n\n    let fbCorrect=false;\n    if(answered){\n      if(q.type==='match') fbCorrect=s.selected[0]===q.correctId;\n      else if(q.type==='sort') fbCorrect=s.selected[0]===q.correctBucket;\n      else fbCorrect=this.setEqual(s.selected,q.correctIds);\n    }\n    vm.feedbackShow=answered;\n    vm.feedbackStyle={background: fbCorrect?'oklch(0.96 0.03 150)':'oklch(0.96 0.04 30)', border:'2px solid '+(fbCorrect?'oklch(0.70 0.09 150)':'oklch(0.72 0.11 30)'), borderRadius:'16px', padding:'14px 16px', textAlign:'center', marginTop:'6px', animation:'popin .2s ease'};\n    vm.feedbackMsg = fbCorrect ? '✓  ¡Muy bien!' : '✋  Casi. Escucha de nuevo:';\n    vm.feedbackReveal = q.targetText;\n    vm.hasRevealEs = !!q.targetEs;\n    vm.feedbackRevealEs = q.targetEs;\n\n    vm.nextShow = answered;\n    vm.nextLabel = (s.idx+1>=total) ? 'Ver resultado' : 'Siguiente ▸';\n    vm.nextOnClick = ()=>this.next();\n    vm.nextStyle = {background:accent,color:'#fff',border:'none',borderRadius:'16px',padding:'13px 30px',cursor:'pointer',fontFamily:\"'Space Mono',monospace\",fontWeight:700,fontSize:'0.9rem',boxShadow:'0 4px 12px rgba(42,38,34,0.12)'};\n\n    if(q.type==='sort'){\n      const selB=s.selected[0];\n      vm.buckets=q.buckets.map(bk=>{\n        let st=Object.assign({display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'6px',minHeight:'138px',background:'#fff',border:'2px solid #E7DFD2',borderRadius:'18px',boxShadow:'0 3px 10px rgba(42,38,34,0.05)',cursor:'pointer',color:'#2A2622',fontFamily:\"'Fraunces',serif\"});\n        if(answered){ if(bk.id===q.correctBucket) st=Object.assign(st,correctStyle); else if(bk.id===selB) st=Object.assign(st,wrongStyle); else st=Object.assign(st,dimStyle); }\n        const es={fontSize:'2.4rem',lineHeight:1};\n        if(bk.emojiBig) es.fontSize='3.6rem';\n        if(bk.emojiSmall) es.fontSize='1.7rem';\n        return {emoji:bk.emoji,emojiStyle:es,labelEs:bk.labelEs,labelEn:bk.labelEn,style:st,disabled:answered,onClick:()=>this.pickSort(bk.id)};\n      });\n      return Object.assign(base,vm);\n    }\n\n    const isMulti=q.type==='multi';\n    const isText = gridType==='text' || gridType==='monthtext';\n    let cols;\n    if(gridType==='multi') cols='repeat(auto-fill, minmax(88px, 1fr))';\n    else cols='repeat(2, 1fr)';\n    vm.optionsGridStyle={display:'grid',gridTemplateColumns:cols,gap:'11px'};\n\n    vm.options=q.options.map(item=>{\n      const sel=s.selected.includes(item.id);\n      let st=Object.assign({},optBase);\n      let showCaption=false;\n      if(isMulti){\n        if(!s.checked){ if(sel) st=Object.assign(st,{border:'2px solid '+accent,background:'#fffdf8'}); }\n        else { if(q.correctIds.includes(item.id)) st=Object.assign(st,correctStyle); else if(sel) st=Object.assign(st,wrongStyle); else st=Object.assign(st,dimStyle); showCaption=true; }\n      } else {\n        if(answered){ if(item.id===q.correctId) st=Object.assign(st,correctStyle); else if(item.id===s.selected[0]) st=Object.assign(st,wrongStyle); else st=Object.assign(st,dimStyle); if(!isText) showCaption=true; }\n      }\n      const textStyle = gridType==='monthtext'\n        ? {fontFamily:\"'Fraunces',serif\",fontWeight:600,fontSize:'1.35rem'}\n        : {fontFamily:\"'Space Mono',monospace\",fontWeight:700,fontSize:'1.9rem'};\n      return {\n        isEmoji:!isText, isText,\n        emoji:item.emoji, text:item.text||item.en, textStyle,\n        showCaption, caption:item.en,\n        style:st, disabled: isMulti? s.checked : answered,\n        onClick: isMulti? (()=>this.toggleMulti(item.id)) : (()=>this.pickMatch(item.id))\n      };\n    });\n\n    vm.showCheck = isMulti && !s.checked;\n    vm.checkDisabled = s.selected.length===0;\n    vm.checkOnClick = ()=>this.checkMulti();\n    vm.checkStyle = {display:'block',width:'100%',marginTop:'14px',background: s.selected.length? accent:'#EDE6DA',color: s.selected.length?'#fff':'#a99f8d',border:'none',borderRadius:'16px',padding:'14px',cursor: s.selected.length?'pointer':'default',fontFamily:\"'Space Mono',monospace\",fontWeight:700,fontSize:'0.9rem'};\n\n    return Object.assign(base,vm);\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
